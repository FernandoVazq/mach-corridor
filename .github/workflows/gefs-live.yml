name: GEFS spread (live)

on:
  schedule:
    - cron: "10 7 * * *"      # GEFS 00Z is complete on AWS by about 06:30 UTC
  workflow_dispatch:
    inputs:
      run: { description: "GEFS run YYYYMMDD00 (default: latest)", default: "" }

permissions:
  contents: write
  actions: write

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.r.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: pip install -r engine/requirements.txt
      - id: r
        working-directory: engine
        run: |
          R="${{ inputs.run }}"; [ -z "$R" ] && R=$(python -c "import gefs_live; print(gefs_live.latest_run())")
          echo "run=$R" >> "$GITHUB_OUTPUT"; echo "GEFS run $R"

  shard:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        fh: ["0,6", "12,18", "24,30", "36,42", "48,54"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: pip install -r engine/requirements.txt
      - working-directory: engine
        run: python gefs_live.py --run ${{ needs.pick.outputs.run }} --fh ${{ matrix.fh }} --out ../gefs_live
      - id: name
        run: echo "n=gefs-live-$(echo '${{ matrix.fh }}' | tr ',' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ steps.name.outputs.n }}", path: gefs_live, retention-days: 3 }

  combine:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: pip install -r engine/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "gefs-live-*", merge-multiple: true, path: gefs_live }
      - working-directory: engine
        run: python gefs_live.py --combine --out ../gefs_live
      - name: Publish to the gefs-live branch and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd gefs_live && du -sh . && git init -q -b gefs-live
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "GEFS spread ${{ needs.pick.outputs.run }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gefs-live
          gh workflow run forecast.yml --repo ${{ github.repository }}
