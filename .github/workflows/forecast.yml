name: Forecast

on:
  schedule:
    # GFS runs at 00/06/12/18 UTC; the full 1-degree run is on AWS ~4 h later.
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        run: pip install -r engine/requirements.txt
      - name: Physics tests
        working-directory: engine
        run: python test_physics.py
      - name: Build forecast atlases from latest GFS
        working-directory: engine
        run: python build.py --out ../site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
