name: Forecast

on:
  schedule:
    # GFS runs at 00/06/12/18 UTC and is complete on AWS ~3.5-4 h later. Check every hour and build
    # only when a newer complete run exists, so the map lags the data by at most about an hour.
    - cron: "25 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.fresh.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: engine/fresh.py, sparse-checkout-cone-mode: false }
      - id: fresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python engine/fresh.py; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        run: pip install -r engine/requirements.txt
      - name: Physics tests
        working-directory: engine
        run: python test_physics.py && python test_rays.py && python test_boom.py && python test_caustic.py && python test_secondary.py && python test_burgers.py && python test_rocket.py && python test_sound.py && python test_bolide.py
      - name: Build forecast atlases from latest GFS
        working-directory: engine
        run: python build.py --out ../site/data
      - name: Rocket boom forecast (issue #50; never blocks the map)
        working-directory: engine
        continue-on-error: true
        timeout-minutes: 12
        run: python rocket.py --data ../site/data
      - name: Fireball booms from NASA JPL CNEOS (issue #61; never blocks the map)
        working-directory: engine
        continue-on-error: true
        timeout-minutes: 15
        run: python bolide.py --data ../site/data
      - name: Route pages (today's FL550 along 69 city pairs; never blocks the map)
        working-directory: engine
        continue-on-error: true
        run: python pages.py
      - name: Add the latest GEFS spread (margin per point and direction), if any
        run: |
          git clone -q --depth 1 --single-branch -b gefs-live "https://github.com/${{ github.repository }}" site/data/gefs || echo "no GEFS spread yet"
          rm -rf site/data/gefs/.git
      - name: Publish latest data snapshot to forecast-data branch
        run: |
          cd site/data
          git init -q -b forecast-data
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "GFS $(python -c 'import json;print(json.load(open("manifest.json"))["run"])')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" forecast-data
          rm -rf .git
      - name: Site smoke test (code changes only; no JS errors, route with psf, WCAG 2.2 AA audit clean)
        if: github.event_name != 'schedule'
        run: |
          cd tests && npm i --no-audit --no-fund --silent && npx playwright install --with-deps chromium > /dev/null
          (cd ../site && python -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2 && node smoke.mjs http://localhost:8765/
          node rk.mjs && node about.mjs && node evid.mjs && node prob.mjs && node clim.mjs && node efb.mjs && node exportr.mjs && node dis.mjs   # fail-closed + evidence, flight chance, climatology, cockpit, export, two models
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
