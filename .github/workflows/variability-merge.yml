name: Variability merge

# Re-run only the merge of a finished variability study run (its shard artifacts are kept 30 days).
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "Run id of the Variability study workflow", required: true }

permissions:
  contents: write
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: var-shard-*
          path: shards
      - name: Merge and add climate indices
        run: |
          python engine/variability.py merge --inp shards --out pub
          cd pub
          for u in https://psl.noaa.gov/data/correlation/oni.data https://psl.noaa.gov/data/correlation/qbo.data \
                   https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt https://www.cpc.ncep.noaa.gov/data/indices/qbo.u30.index \
                   https://psl.noaa.gov/data/correlation/nina34.anom.data https://psl.noaa.gov/data/correlation/ao.data; do
            curl -sfL --max-time 60 "$u" -o "idx_$(basename $u)" || echo "could not fetch $u"
          done
          ls -la; du -sh .
      - name: Publish to the study-variability branch
        run: |
          cd pub
          git init -q -b study-variability
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Variability dataset from run ${{ inputs.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" study-variability
