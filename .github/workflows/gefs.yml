name: GEFS spread hindcast

on:
  workflow_dispatch:
    inputs:
      start: { description: "First date (00 UTC)", default: "2025-10-09" }
      end: { description: "Last date", default: "2026-10-08" }
      step_days: { description: "Days between samples", default: "14" }
      members: { description: "Members (max 31)", default: "31" }

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: GEFS shard
        working-directory: engine
        run: |
          set -o pipefail
          python gefs.py --start ${{ inputs.start }} --end ${{ inputs.end }} --step-days ${{ inputs.step_days }} \
            --members ${{ inputs.members }} --shard ${{ matrix.shard }} --nshards 9 --out ../gefs_out 2>&1 | tee ../gefs_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gefs-shard-${{ matrix.shard }}
          path: gefs_out
          retention-days: 30
      - name: Publish the log (readable without Actions log access)
        if: always()
        run: |
          mkdir -p logbr && cp gefs_log.txt logbr/ 2>/dev/null || echo "no log" > logbr/gefs_log.txt
          cd logbr && git init -q -b ci-log-gefs-${{ matrix.shard }}
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="mach-corridor-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "log run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log-gefs-${{ matrix.shard }}
