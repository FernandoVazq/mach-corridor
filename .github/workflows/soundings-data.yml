name: Soundings data

on:
  workflow_dispatch:
    inputs:
      start: { description: "First day", default: "2025-10-01" }
      end: { description: "Last day", default: "2026-09-30" }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: pip install -r engine/requirements.txt
      - working-directory: engine
        run: python validate.py --fetch-soundings --start ${{ inputs.start }} --end ${{ inputs.end }} --out ../snd
      - run: |
          cd snd && gzip -9 soundings.json && ls -la && git init -q -b soundings-data
          git -c user.name=bot -c user.email=actions@users.noreply.github.com add -A && git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm "IGRA2 soundings ${{ inputs.start }} to ${{ inputs.end }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" soundings-data
